# Builds Lemon Studio.app on macOS and uploads it as an artifact, without the full cross-platform test matrix.
name: Mac app

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mac-app-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    # Intel runner: the app is built for x86_64 Macs.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test Sample Killer
        run: cargo test -p sample-killer --locked
      - name: Bundle the app
        run: cargo run -p bundle-app --locked
      - name: Zip
        run: cd target/bundled && ditto -c -k --keepParent "Lemon Studio.app" LemonStudio-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LemonStudio-macOS
          path: target/bundled/LemonStudio-macOS.zip
          retention-days: 7
